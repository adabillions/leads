name: Crawl lead sites
on:
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel fetches
        default: "48"
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Crawl homepages
        run: python3 scripts/verify_lines/crawl_domains.py data/site_domains.txt data/sites.jsonl ${{ github.event.inputs.workers }}
      - name: Compress and commit results
        run: |
          gzip -9 -k -f data/sites.jsonl
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add -f data/sites.jsonl.gz
          git commit -m "Add crawled site summaries for lead domains" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
